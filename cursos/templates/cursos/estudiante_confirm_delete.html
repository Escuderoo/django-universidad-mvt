<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow p-4 text-center">
            <h3 class="text-danger mb-3">¿Estás seguro?</h3>
            <p>Vas a eliminar al estudiante: <strong>{{ estudiante.nombre }} {{ estudiante.apellido }}</strong></p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100">Sí, eliminar</button>
            </form>
            <a href="{% url 'web_lista_estudiantes' %}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
        </div>
    </div>
</body>
</html>
